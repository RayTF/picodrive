name: Picodrive CI
on: [push, pull_request]
jobs:
  build-psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev
    steps:
    - name: build environment
      run: |
        apk add --no-cache git gcc g++ zip build-base
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: build
      run: |
        export CROSS_COMPILE=psp-
        git config --global --add safe.directory "$PWD"
        ver=$(cut -d'"' -f2 platform/common/version.h)-$(git rev-parse --short HEAD)
        ./configure --platform=psp
        mkdir "release-$ver"
        for theme in sugc smduc vectordrive; do
          make clean
          make "THEME=$theme" -j"$(getconf _NPROCESSORS_ONLN)" all
        done
    - name: artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PSP
        path: release-*/VectorDrive-*.zip
